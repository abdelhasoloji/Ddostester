apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ddostester-lab
resources:
  - namespace.yaml
  - policy.yaml
  - target.yaml
  - probe.yaml
  - database.yaml
  - control.yaml
  - fleet.yaml
  # Shared agent→site registry (control plane + fleet server read the same values).
  - fleet-registry.yaml
  # Three coordination replicas: one eviction tolerated (minAvailable: 2).
  - fleet-pdb.yaml
