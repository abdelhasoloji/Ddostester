name: Deploy

# Continuous deployment via a SELF-HOSTED runner installed on VPS 1 (the
# production control plane). On a green CI run on main (and on manual dispatch)
# it updates the running service in place — no inbound SSH, no secrets, works
# behind a firewall. The job requires the `vps1` runner label, so it only ever
# runs on VPS 1 (the old ac02 runner, unlabelled, no longer matches).
#
# One-time server setup — run deploy/provision/host-runner.sh on VPS 1 (see
# docs/ci-cd.md). It registers the runner as the service user (whose home holds
# the ~/ddostester clone) with the `vps1` label and grants the one sudo rule
# (systemctl restart ddostester) that deploy/update.sh needs.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy'
        default: main

permissions:
  contents: read

# Never run two deploys at once; let a running deploy finish rather than cancel it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy only when the triggering CI passed, or when dispatched manually.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    # Pinned to the VPS 1 runner (label `vps1`) so deploys land on the
    # production control plane and nowhere else. Register it with
    # deploy/provision/host-runner.sh.
    runs-on: [self-hosted, vps1]
    timeout-minutes: 15
    steps:
      - name: Update and restart the service
        env:
          DEPLOY_BRANCH: ${{ github.event.inputs.ref || 'main' }}
          DEPLOY_EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || '' }}
          # Deployment model on the server: 'systemd' (default) or 'docker'.
          # Set the repository variable DEPLOY_MODE=docker to deploy via
          # Docker Compose (the api image serves API + UI).
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE || 'systemd' }}
        run: |
          set -e
          REPO="${DDOSTESTER_DIR:-$HOME/ddostester}"
          if [ ! -d "$REPO/.git" ]; then
            echo "::error::Service repo not found at $REPO. Set DDOSTESTER_DIR on the runner, or clone the repo there."
            exit 1
          fi
          echo "Deploying '$DEPLOY_BRANCH' into $REPO"
          DEPLOY_EXPECTED_COMMIT="$DEPLOY_EXPECTED_COMMIT" DEPLOY_BRANCH="$DEPLOY_BRANCH" bash "$REPO/deploy/update.sh"
