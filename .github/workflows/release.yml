# Release automation (E14): when package.json's version changes on main and no
# tag exists for it yet, create the git tag `vX.Y.Z` and a GitHub Release whose
# body is that version's CHANGELOG section. Read-only otherwise — it does NOT
# touch the deploy pipeline (deploy.yml runs independently on CI success).
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'CHANGELOG.md'

permissions:
  contents: write # create tags + releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags to check for an existing one

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if the tag already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's changelog section
        if: steps.check.outputs.exists == 'false'
        run: |
          # The section runs from `## vX.Y.Z` to the next `## v` (or EOF).
          awk '/^## v${{ steps.v.outputs.version }} /{f=1} f{print} /^## v/{if(f && !/^## v${{ steps.v.outputs.version }} /)exit}' CHANGELOG.md > NOTES.md || true
          if [ ! -s NOTES.md ]; then echo "Release v${{ steps.v.outputs.version }}" > NOTES.md; fi

      - name: Create tag + GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"
          gh release create "v${{ steps.v.outputs.version }}" \
            --title "v${{ steps.v.outputs.version }}" \
            --notes-file NOTES.md
