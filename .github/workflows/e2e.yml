name: E2E
# Browser smoke, kept OUT of the PR/push pipeline: it runs nightly (and on
# manual dispatch) instead, so a slow/flaky browser run never blocks a merge.
# Re-add `pull_request:` / `push:` here to gate merges on it again.
on:
  schedule:
    - cron: '0 2 * * *' # nightly at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.sha }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
