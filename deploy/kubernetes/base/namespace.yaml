apiVersion: v1
kind: Namespace
metadata:
  name: ddostester-lab
  labels:
    app.kubernetes.io/part-of: ddostester-lab
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-budget
  namespace: ddostester-lab
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 6Gi
    limits.cpu: '8'
    limits.memory: 10Gi
    pods: '16'
    count/jobs.batch: '3'
    services.loadbalancers: '0'
    services.nodeports: '0'
