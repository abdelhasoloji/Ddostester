groups:
  - name: private-lab-collection
    rules:
      - alert: LabControlScrapeUnavailable
        expr: up{job="lab-control"} == 0 or absent(up{job="lab-control"})
        for: 1m
        labels:
          severity: warning
          environment: private-kubernetes-lab
        annotations:
          summary: Dedicated lab control metrics unavailable for at least one minute
      - alert: LabTargetReceiptsScrapeUnavailable
        expr: up{job="lab-target-receipts"} == 0 or absent(up{job="lab-target-receipts"})
        for: 1m
        labels:
          severity: warning
          environment: private-kubernetes-lab
        annotations:
          summary: HTTP target receipt metrics unavailable for at least one minute
