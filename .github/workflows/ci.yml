name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# One run per ref: a new push to a PR cancels the superseded run (faster
# feedback, less waste). main runs are keyed per-SHA so none are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The work is split into jobs that run in parallel instead of one long
# sequential job. Wall-clock is now the SLOWEST job (the backend suite, whose
# bounded end-to-end runs have real durations) rather than the SUM of every
# step. Each job restores the same npm cache, so the extra installs are ~5 s.
# The Deploy workflow keys off this workflow's overall conclusion, which is
# success only if every job below passes — so the deploy gate is unchanged.
jobs:
  # Lint + typecheck + the dependency audit. No tests, so it finishes fast.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run lint
      - run: npm run typecheck
      - run: node --test scripts/operations/witness/proof.test.mjs
      - run: node --test scripts/operations/deploy-bootstrap.test.mjs
      - run: node --test deploy/benchmark/telemetry/metrics.test.mjs
      - run: npm audit --audit-level=high

  # Frontend tests (with coverage thresholds) + build.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run test:coverage -w frontend
      - run: npm run build -w frontend

  # Backend tests (with coverage thresholds) + build. The catalog's bounded
  # end-to-end runs (CATALOG_E2E), whose real per-run durations dominated CI,
  # are NOT run here — they moved to the nightly E2E workflow. Unit coverage
  # and PostgreSQL coverage must meet the existing thresholds; only the slow
  # integration runs left the per-push path. PostgreSQL contract tests now
  # contribute to the same coverage gate; the separate recovery job remains.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ddostester_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: ddostester_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddostester_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://ddostester_test:disposable_ci_only@127.0.0.1:5432/ddostester_test
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run test:coverage -w backend -- --maxWorkers=1
      - run: npm run build -w backend

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ddostester_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: ddostester_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddostester_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://ddostester_test:disposable_ci_only@127.0.0.1:5432/ddostester_test
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run test:postgres -w backend
      - name: Authenticated recovery gate
        env:
          PG_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/operations/recovery-check.mjs
