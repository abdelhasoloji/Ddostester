apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lab-postgres
spec:
  serviceName: lab-postgres
  replicas: 1
  selector:
    matchLabels: { app: lab-postgres }
  template:
    metadata:
      labels: { app: lab-postgres }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: ddostester-lab-postgres:local
          imagePullPolicy: Never
          env:
            - { name: POSTGRES_USER, value: ddostester_lab }
            - { name: POSTGRES_DB, value: ddostester_lab }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: lab-identities, key: database-password }
          ports: [{ containerPort: 5432 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          readinessProbe:
            exec:
              command: [pg_isready, -U, ddostester_lab]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: { sizeLimit: 8Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: lab-postgres
spec:
  selector: { app: lab-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
