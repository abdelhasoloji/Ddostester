apiVersion: v1
kind: Namespace
metadata:
  name: shieldtest-qualification
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prototype-budget
spec:
  hard:
    pods: '3'
    requests.cpu: 150m
    requests.memory: 192Mi
    limits.cpu: 300m
    limits.memory: 384Mi
    requests.ephemeral-storage: 48Mi
    limits.ephemeral-storage: 96Mi
    services: '0'
    persistentvolumeclaims: '0'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: passive-only
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passive-telemetry
spec:
  replicas: 3
  revisionHistoryLimit: 1
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: passive-telemetry
  template:
    metadata:
      labels:
        app: passive-telemetry
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      # Candidate SSH hostname; validate this label against the intended cluster before apply.
      nodeSelector:
        kubernetes.io/hostname: ac02
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetry
          image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          imagePullPolicy: IfNotPresent
          command: [node, /opt/telemetry/telemetry.mjs]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 32Mi
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "const fs=require('node:fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/telemetry-ready','utf8'))<90000?0:1)"
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - name: script
              mountPath: /opt/telemetry
              readOnly: true
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: passive-telemetry
            defaultMode: 0444
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
