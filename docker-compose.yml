# WEDOS ShieldTest — control plane (dev / internal).
# The API is exposed on loopback only: put it behind an internal reverse proxy.
services:
  db:
    # PostgreSQL by default; for TimescaleDB: DB_IMAGE=timescale/timescaledb:latest-pg16
    image: ${DB_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: shieldtest
      POSTGRES_USER: shieldtest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Published on loopback only, so a host-run API (npm start) can reach it too.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shieldtest']
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ddostester-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8080/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      PORT: 8080
      HOST: 0.0.0.0 # OK here: published on loopback only via the mapping above
      # List ONLY internal / mandated hosts.
      ALLOWED_TARGETS: ${ALLOWED_TARGETS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://shieldtest:${POSTGRES_PASSWORD:?}@db:5432/shieldtest
      # Optional application-level auth + RBAC. Empty = disabled (rely on the
      # loopback bind + SSH tunnel). Set both to require a signed token.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_USERS: ${AUTH_USERS:-}
      # Load agent: 'builtin' (bounded in-process HTTP) or 'k6' (external tool).
      AGENT: ${AGENT:-builtin}
      # Optional CORS origin for the UI if served from a different host.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Isolated lab targets for DRS validation + the class-C network bench
      # (docs/drs-validation-policy.md). A governance label list — the control
      # plane never connects to it. Empty = DRS + bench dispatch disabled. Must
      # NOT overlap ALLOWED_TARGETS (the API fails closed at startup if it does).
      LAB_TARGETS: ${LAB_TARGETS:-}
      # Governed class-C bench dispatch: the bearer token the ISOLATED
      # shieldtest-lab runner presents to claim/complete runs. Empty = dispatch
      # disabled (fail-closed). The control plane records and serves runs; it
      # NEVER emits amplification traffic — only the isolated runner does.
      BENCH_RUNNER_TOKEN: ${BENCH_RUNNER_TOKEN:-}

  # --- Monitoring (optional): docker compose --profile monitoring up -d --------
  prometheus:
    image: prom/prometheus:latest
    profiles: ['monitoring']
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Not exposed publicly; queried by Grafana over the internal network.

  grafana:
    image: grafana/grafana:latest
    profiles: ['monitoring']
    restart: unless-stopped
    depends_on: [prometheus]
    ports:
      - '127.0.0.1:3000:3000' # access via SSH tunnel, never public
    environment:
      # Default lets a plain `docker compose up` of the core (db + api) work with
      # only POSTGRES_PASSWORD — Compose interpolates every service's vars, even
      # profiled ones. Override GRAFANA_PASSWORD before using `--profile monitoring`.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # --- TLS / mTLS reverse proxy (optional): docker compose --profile proxy up -d
  proxy:
    image: caddy:2
    profiles: ['proxy']
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '443:443'
    environment:
      SHIELDTEST_DOMAIN: ${SHIELDTEST_DOMAIN:-shieldtest.internal}
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # - ./deploy/proxy/ca.crt:/etc/caddy/ca.crt:ro   # uncomment for mTLS
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pgdata:
  grafana-data:
  caddy-data:
  caddy-config:
