worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  log_format lab escape=json '{"at":"$time_iso8601","source":"$remote_addr","status":$status,"durationSec":$request_time,"epochSec":$msec,"run":"$http_x_wedos_test"}';
  access_log /dev/stdout lab;
  access_log /var/log/lab/requests.jsonl lab;
  client_body_temp_path /tmp/client_body;
  fastcgi_temp_path /tmp/fastcgi;
  proxy_temp_path /tmp/proxy;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 16k;
  client_header_timeout 5s;
  client_body_timeout 5s;
  keepalive_timeout 5s;
  server {
    listen 8080;
    root /var/www/benchmark;
    index index.html;
    location = /health { return 200 'ok\n'; }
    location ~ \.php$ {
      try_files $uri =404;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_read_timeout 4s;
    }
    location / { try_files $uri $uri/ =404; }
  }
}
