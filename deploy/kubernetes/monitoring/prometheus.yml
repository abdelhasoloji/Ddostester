global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: private-kubernetes-lab
storage:
  tsdb:
    retention:
      time: 7d
      size: 1GB
rule_files:
  - /etc/prometheus/lab.rules.yml
scrape_configs:
  - job_name: lab-control
    metrics_path: /metrics
    scrape_timeout: 5s
    sample_limit: 5000
    static_configs:
      - targets:
          - lab-control:8080
  - job_name: lab-prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
  - job_name: lab-target-receipts
    scrape_interval: 5s
    scrape_timeout: 3s
    sample_limit: 5000
    metrics_path: /metrics
    static_configs:
      - targets:
          - lab-target:9101
