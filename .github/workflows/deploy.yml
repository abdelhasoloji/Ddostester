name: Deploy

# Continuous deployment via a SELF-HOSTED runner installed on the WEDOS server.
# On a green CI run on main (and on manual dispatch) it updates the running
# service in place — no inbound SSH, no secrets, works behind a firewall.
#
# One-time server setup (see docs/ci-cd.md):
#   1. Register a self-hosted runner for this repo, running as the deploy user
#      (its home holds the ~/ddostester clone that the service runs from).
#   2. Give that user passwordless sudo for: systemctl restart ddostester.
# After that, every push to main that passes CI deploys automatically.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy'
        default: main

permissions:
  contents: read

# Never run two deploys at once; let a running deploy finish rather than cancel it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy only when the triggering CI passed, or when dispatched manually.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Update and restart the service
        env:
          DEPLOY_BRANCH: ${{ github.event.inputs.ref || 'main' }}
          # Deployment model on the server: 'systemd' (default) or 'docker'.
          # Set the repository variable DEPLOY_MODE=docker to deploy via
          # Docker Compose (the api image serves API + UI).
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE || 'systemd' }}
        run: |
          set -e
          REPO="${DDOSTESTER_DIR:-$HOME/ddostester}"
          if [ ! -d "$REPO/.git" ]; then
            echo "::error::Service repo not found at $REPO. Set DDOSTESTER_DIR on the runner, or clone the repo there."
            exit 1
          fi
          echo "Deploying '$DEPLOY_BRANCH' into $REPO"
          DEPLOY_BRANCH="$DEPLOY_BRANCH" bash "$REPO/deploy/update.sh"
