apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-probe
spec:
  replicas: 1
  selector:
    matchLabels: { app: lab-probe }
  template:
    metadata:
      labels: { app: lab-probe }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: probe
          image: ddostester-lab-probe:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8099 }]
          env:
            - { name: PROBE_AGENT_BIND, value: 0.0.0.0 }
            - { name: PROBE_AGENT_ALLOWLIST, value: lab-target }
            - name: PROBE_AGENT_TOKEN
              valueFrom:
                secretKeyRef: { name: probe-identity, key: token }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8099 }
---
apiVersion: v1
kind: Service
metadata:
  name: lab-probe
spec:
  selector: { app: lab-probe }
  ports: [{ port: 8099, targetPort: 8099 }]
