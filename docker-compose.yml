# WEDOS ShieldTest — control plane (dev / internal).
# The API is exposed on loopback only: put it behind an internal reverse proxy.
services:
  db:
    # PostgreSQL by default; for TimescaleDB: DB_IMAGE=timescale/timescaledb:latest-pg16
    image: ${DB_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: shieldtest
      POSTGRES_USER: shieldtest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Published on loopback only, so a host-run API (npm start) can reach it too.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shieldtest']
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ddostester-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8080/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      PORT: 8080
      HOST: 0.0.0.0 # OK here: published on loopback only via the mapping above
      # List ONLY internal / mandated hosts.
      ALLOWED_TARGETS: ${ALLOWED_TARGETS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://shieldtest:${POSTGRES_PASSWORD:?}@db:5432/shieldtest
      # Optional application-level auth + RBAC. Empty = disabled (rely on the
      # loopback bind + SSH tunnel). Set both to require a signed token.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_USERS: ${AUTH_USERS:-}
      # Load agent: 'builtin' (bounded in-process HTTP) or 'k6' (external tool).
      AGENT: ${AGENT:-builtin}
      # Optional CORS origin for the UI if served from a different host.
      CORS_ORIGIN: ${CORS_ORIGIN:-}

  # --- Isolated synthetic network lab -----------------------------------------
  # Safe UDP amplification model: no spoofing and no public protocol reflectors.
  # The `internal: true` network has no Docker-managed Internet egress.
  lab-target:
    profiles: ['network-lab']
    build:
      context: ./lab/target
    image: shieldtest-lab-target:latest
    restart: unless-stopped
    environment:
      LISTEN_PORT: 9002
      METRICS_PORT: 9102 # Prometheus text metrics, scraped over the internal lab net only
    networks:
      shieldtest_lab:
        ipv4_address: 192.168.100.99

  # Optional mitigation node (scrubber). To route the reflector THROUGH it, set
  # LAB_REFLECTOR_TARGET=192.168.100.60; otherwise the reflector hits the target
  # directly and the scrubber simply idles.
  lab-scrubber:
    profiles: ['network-lab']
    build:
      context: ./lab
      dockerfile: scrubber/Dockerfile
    image: shieldtest-lab-scrubber:latest
    restart: unless-stopped
    depends_on: [lab-target]
    environment:
      LISTEN_PORT: 9005
      METRICS_PORT: 9105 # Prometheus text metrics, scraped over the internal lab net only
      TARGET_HOST: 192.168.100.99
      TARGET_PORT: 9002
      LAB_CIDR_PREFIX: 192.168.100.
      THRESHOLD_PPS: ${LAB_THRESHOLD_PPS:-100}
      CEILING_PPS: ${LAB_CEILING_PPS:-50}
      DETECTION_DELAY_SEC: ${LAB_DETECTION_DELAY_SEC:-3}
    networks:
      shieldtest_lab:
        ipv4_address: 192.168.100.60

  lab-reflector:
    profiles: ['network-lab']
    build:
      context: ./lab
      dockerfile: synthetic-reflector/Dockerfile
    image: shieldtest-lab-reflector:latest
    restart: unless-stopped
    depends_on: [lab-target]
    environment:
      LISTEN_PORT: 9001
      METRICS_PORT: 9101 # Prometheus text metrics, scraped over the internal lab net only
      # Default: straight to the target. Set LAB_REFLECTOR_TARGET=192.168.100.60
      # to route through the scrubber and study detection/mitigation.
      TARGET_HOST: ${LAB_REFLECTOR_TARGET:-192.168.100.99}
      TARGET_PORT: ${LAB_REFLECTOR_TARGET_PORT:-9002}
      LAB_CIDR_PREFIX: 192.168.100.
      MAX_FACTOR: ${LAB_MAX_FACTOR:-50}
      MAX_RESPONSE_BYTES: ${LAB_MAX_RESPONSE_BYTES:-8192}
      MAX_PACKET_FACTOR: ${LAB_MAX_PACKET_FACTOR:-10}
    networks:
      shieldtest_lab:
        ipv4_address: 192.168.100.50

  lab-generator:
    profiles: ['network-lab']
    build:
      context: ./lab
      dockerfile: generator/Dockerfile
    image: shieldtest-lab-generator:latest
    environment:
      REFLECTOR_HOST: 192.168.100.50
      REFLECTOR_PORT: 9001
      LAB_CIDR_PREFIX: 192.168.100.
      # Synthetic protocol shape (amplification factors): generic | dns | ssdp | ntp | memcached.
      PROFILE: ${PROFILE:-generic}
      FACTOR: ${FACTOR:-10}
      PACKET_FACTOR: ${PACKET_FACTOR:-1}
      PPS: ${PPS:-20}
      # Rate-over-time shape: constant | ramp | wave | burst.
      SHAPE: ${SHAPE:-constant}
      DURATION_SEC: ${DURATION_SEC:-10}
      MAX_PPS: ${LAB_MAX_PPS:-500}
      MAX_DURATION_SEC: ${LAB_MAX_DURATION_SEC:-60}
      MAX_PACKET_FACTOR: ${LAB_MAX_PACKET_FACTOR:-10}
    networks:
      shieldtest_lab:
        ipv4_address: 192.168.100.10

  # Optional benign background traffic, to measure collateral at the scrubber.
  # Sends never-amplified packets straight to the scrubber (.60).
  lab-legit:
    profiles: ['network-lab']
    build:
      context: ./lab
      dockerfile: generator/Dockerfile
    image: shieldtest-lab-generator:latest
    environment:
      MODE: legit
      SHAPE: constant
      REFLECTOR_HOST: 192.168.100.60
      REFLECTOR_PORT: 9005
      LAB_CIDR_PREFIX: 192.168.100.
      PPS: ${LAB_LEGIT_PPS:-10}
      DURATION_SEC: ${DURATION_SEC:-10}
      MAX_PPS: ${LAB_MAX_PPS:-500}
      MAX_DURATION_SEC: ${LAB_MAX_DURATION_SEC:-60}
    networks:
      shieldtest_lab:
        ipv4_address: 192.168.100.11

  # --- Monitoring (optional): docker compose --profile monitoring up -d --------
  prometheus:
    image: prom/prometheus:latest
    profiles: ['monitoring']
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Also attached to the internal lab network so it can scrape the lab
    # reflector/target metrics when the network-lab profile is running.
    # (The lab targets simply show as "down" when that profile is not up.)
    networks:
      - default
      - shieldtest_lab
    # Not exposed publicly; queried by Grafana over the internal network.

  grafana:
    image: grafana/grafana:latest
    profiles: ['monitoring']
    restart: unless-stopped
    depends_on: [prometheus]
    ports:
      - '127.0.0.1:3000:3000' # access via SSH tunnel, never public
    environment:
      # Default lets a plain `docker compose up` of the core (db + api) work with
      # only POSTGRES_PASSWORD — Compose interpolates every service's vars, even
      # profiled ones. Override GRAFANA_PASSWORD before using `--profile monitoring`.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # --- TLS / mTLS reverse proxy (optional): docker compose --profile proxy up -d
  proxy:
    image: caddy:2
    profiles: ['proxy']
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '443:443'
    environment:
      SHIELDTEST_DOMAIN: ${SHIELDTEST_DOMAIN:-shieldtest.internal}
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # - ./deploy/proxy/ca.crt:/etc/caddy/ca.crt:ro   # uncomment for mTLS
      - caddy-data:/data
      - caddy-config:/config

networks:
  shieldtest_lab:
    name: shieldtest_lab
    internal: true
    ipam:
      config:
        - subnet: 192.168.100.0/24

volumes:
  pgdata:
  grafana-data:
  caddy-data:
  caddy-config:
