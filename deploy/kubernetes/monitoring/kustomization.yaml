apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ddostester-lab
resources:
  - workloads.yaml
  - policy.yaml
configMapGenerator:
  - name: lab-prometheus-config
    files:
      - prometheus.yml
      - lab.rules.yml
  - name: lab-grafana-provisioning
    files:
      - datasource.yml
      - dashboards.yml
  - name: lab-grafana-dashboards
    files:
      - 01-run.json
      - 02-resilience.json
      - 03-fleet.json
      - 04-receipts.json
