name: E2E
# End-to-end suites kept OUT of the PR/push pipeline: they run nightly (and on
# manual dispatch) instead, so slow/flaky integration runs never block a merge
# or a deploy. Re-add `pull_request:` / `push:` here to gate merges on them.
on:
  schedule:
    - cron: '0 2 * * *' # nightly at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Browser smoke (Playwright).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Backend catalog end-to-end runs (CATALOG_E2E): representative campaign
  # shapes driven end-to-end to a terminal state with their bounded, real per-
  # run durations. Moved off the per-push CI (where they were the dominant cost)
  # to here — the push CI keeps full unit coverage, this keeps the functional
  # end-to-end validation running every night.
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run test:catalog
