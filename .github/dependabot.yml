version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One tidy PR for safe (minor/patch) updates. Majors are intentionally left
    # out — they are bumped deliberately, not auto-batched — while security
    # advisories still open their own PRs regardless of this filter.
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
